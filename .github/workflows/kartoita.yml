name: Kartoita hintaindeksit

# Kertaluonteinen apuajo: selvittää StatFinin hintaindeksitaulukoiden
# rakenteen ja tulostaa sen lokiin. EI muuta dataa eikä sivustoa –
# ei kirjoita tiedostoja eikä committaa mitään.
# Tämän workflow'n voi poistaa, kun kartoitus on tehty.

on:
  workflow_dispatch:

jobs:
  kartoita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aja kartoitus
        run: python probe_index.py
